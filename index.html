<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aplicación de consola - JavaScript</title>
  </head>
  <body>
    <h1>Gestión de estudiantes y notas</h1>
    <p>Presiona un botón e ingresa la información solicitada.</p>
      <p>Los resultados también se muestran en la consola (F12).</p>

    <h2>Menú completo</h2>
    <button id="btnMenu">Iniciar menú</button>

    <h2>Funciones por separado</h2>
    <button id="btnVer">Ver estudiantes</button>
    <button id="btnAgregar">Agregar estudiante</button>
    <button id="btnPromedios">Ver promedios</button>
    <button id="btnAprobados">Ver aprobados</button>
    <button id="btnReprobados">Ver reprobados</button>

    <script src="app.js"></script>
    <script>
      // Cada botón llama a una función de app.js
      document.getElementById("btnMenu").addEventListener("click", iniciarAplicacion);
      document.getElementById("btnVer").addEventListener("click", verEstudiantes);
      document.getElementById("btnAgregar").addEventListener("click", agregarEstudiante);
      document.getElementById("btnPromedios").addEventListener("click", verPromedios);
      document.getElementById("btnAprobados").addEventListener("click", verAprobados);
      document.getElementById("btnReprobados").addEventListener("click", verReprobados);
    </script>
  </body>
</html>
